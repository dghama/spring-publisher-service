# === Application name ===
spring.application.name=${APP_NAME:Publisher-manager}

# === Database (defaults for unit tests) ===
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:testdb}
spring.datasource.username=${POSTGRES_USER:testuser}
spring.datasource.password=${POSTGRES_PASSWORD:testpass}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate auto schema generation (create-drop is good for tests)
spring.jpa.hibernate.ddl-auto=${HIBERNATE_DDL_AUTO:create-drop}
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
